workflows:
  ios-capacitor-appstore:
    name: Oposita Sanidad · iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials   # se crea en Codemagic UI, ver README
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.opositasanidad.app"
      node: latest
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Instalar dependencias npm
        script: npm install

      - name: Añadir plataforma iOS (si no existe) y sincronizar
        script: |
          test -d ios || npx cap add ios
          npx cap sync ios

      - name: Instalar CocoaPods
        script: |
          cd ios/App && pod install

      - name: Configurar firma automática (App Store Connect API)
        script: |
          xcode-project use-profiles

      - name: Compilar .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # ponlo en true cuando quieras enviar a revisión directamente
