workflows:
  android-capacitor-googleplay:
    name: Oposita Sanidad · Android (Google Play)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - googleplay_credentials   # se crea en Codemagic UI, ver README
      vars:
        PACKAGE_NAME: "com.opositasanidad.app"
      node: latest
      java: 17
      android_signing:
        - oposita-sanidad  # nombre del keystore subido a Codemagic
 
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
 
    scripts:
      - name: Instalar dependencias npm
        script: npm install
 
      - name: Añadir plataforma Android (si no existe) y sincronizar
        script: |
          test -d android || npx cap add android
          npx cap sync android
 
      - name: Compilar y firmar el .aab
        script: |
          cd android
          ./gradlew bundleRelease
 
      - name: Compilar .apk (opcional, para pruebas en dispositivo)
        script: |
          cd android
          ./gradlew assembleRelease
 
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
 
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal   # cámbialo a "production" cuando quieras publicar directamente
        submit_as_draft: true
 
